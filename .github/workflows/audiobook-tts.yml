name: Build Audiobook Audio

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "Path to uploaded text file/folder in repo (txt or md)"
        required: false
        default: "uploads"
  push:
    paths:
      - "uploads/**/*.txt"
      - "uploads/**/*.md"

jobs:
  synthesize:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-cloud-texttospeech

      - name: Generate audiobook audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE || 'onyx' }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_CLOUD_TTS_VOICE: ${{ vars.GOOGLE_CLOUD_TTS_VOICE || 'en-US-Wavenet-D' }}
        run: |
          SOURCE_PATH="${{ github.event.inputs.source_path }}"
          python scripts/generate_audiobook.py \
            --source "${SOURCE_PATH:-uploads}" \
            --output dist/audiobook.mp3 \
            --work-dir dist/work

      - name: Upload audiobook artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-output-${{ github.run_number }}
          path: |
            dist/audiobook.mp3
            dist/audiobook.json
          if-no-files-found: error
